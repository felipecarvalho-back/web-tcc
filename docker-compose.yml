services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinela-portaria
    ports:
      - "8080:10000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8080
      - DB_CONNECTION=sqlite
      - SESSION_DRIVER=database
      - CACHE_STORE=database
    restart: unless-stopped
